<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Steelreach</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>/* Theme follows the phone. The map renderer reads these custom properties (readTheme in
   src/render/draw.js), so both themes' colours live only here. */
:root {
  --bg: #eef2ea; --fg: #1d2a22; --text: #1d2a22;
  --ground: #e2e8dc; --grid: rgba(40, 64, 48, 0.07);
  --belt: #c6cdc2; --belt-edge: #9da899; --belt-line: #7e8b7b; --chevron: rgba(255, 255, 255, 0.85);
  --panel: #f8faf6; --shadow: rgba(24, 40, 30, 0.16); --item-edge: rgba(16, 24, 19, 0.6);
  --warn: #e39a17; --bad: #dc4436; --accent: #2e9b6c; --power: #e2b10f;
  /* UI-only names (the renderer never reads them). They reuse the renderer's hues; --ui-accent and
     --ui-bad are shades of --accent and --bad because the map's own shades, as text or behind text,
     fall short of 4.5:1 contrast on the panels. */
  --ui-panel2: #e4eae0; --ui-line: rgba(29, 42, 34, 0.13); --ui-muted: #5a6a60;
  --ui-accent: #2f7d5b; --ui-on-accent: #ffffff; --ui-bad: #b3362b; --ui-on-bad: #ffffff; --ui-stall: #8a5a00;
  /* Declared once: var() resolves per theme because --warn and --shadow change with it. */
  --ui-badge: var(--warn); --ui-shadow: 0 2px 10px var(--shadow);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121815; --fg: #dbe7de; --text: #dbe7de;
    --ground: #19211c; --grid: rgba(220, 240, 226, 0.05);
    --belt: #343f39; --belt-edge: #4a5751; --belt-line: #8b9a90; --chevron: rgba(255, 255, 255, 0.22);
    --panel: #212a25; --shadow: rgba(0, 0, 0, 0.38); --item-edge: rgba(236, 245, 239, 0.62);
    --warn: #f2b23a; --bad: #ff5f52; --accent: #4cc590; --power: #f5cc3a;
    --ui-panel2: #2c3833; --ui-line: rgba(219, 231, 222, 0.13); --ui-muted: #93a49a;
    --ui-accent: var(--accent); --ui-on-accent: #0d1410; --ui-bad: #ff7a6e; --ui-on-bad: #1a0d0c; --ui-stall: var(--warn);
  }
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
/* The Claude iOS app draws under its top bar, so keep content clear of the safe areas. */
body {
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%;
}
/* The game owns every touch on the map: no browser pan, pinch zoom or double-tap zoom. */
#game { display: block; width: 100%; height: 100%; touch-action: none; }
/* Component display rules below would otherwise beat the hidden attribute. */
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
h2, h3, p { margin: 0; }
.grow { flex: 1 1 auto; }
.muted { color: var(--ui-muted); }

/* --- controls ------------------------------------------------------------------------------ */
/* 44 px is Apple's minimum comfortable tap size; every control is at least that in both axes. */
button {
  font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; min-width: 44px; min-height: 44px;
}
button:disabled { cursor: default; opacity: .4; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-icon], .ico { display: inline-flex; width: 22px; height: 22px; flex: none; }
[data-icon] svg, .ico svg { width: 100%; height: 100%; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px;
  border-radius: 12px; background: var(--ui-panel2); font-weight: 600;
}
.btn:active:not(:disabled) { filter: brightness(.92); }
.btn.icon { padding: 0; width: 44px; background: transparent; position: relative; }
.btn.round { padding: 0; width: 48px; height: 48px; border-radius: 50%; background: var(--panel); box-shadow: var(--ui-shadow); }
.btn.primary { background: var(--ui-accent); color: var(--ui-on-accent); }
.btn.danger { color: var(--ui-bad); }
.btn.wide { width: 100%; min-height: 48px; margin-top: 10px; }
.btn.armed { background: var(--ui-bad); color: var(--ui-on-bad); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; background: var(--ui-muted); }
.sw.circle { border-radius: 50%; }
.sw.diamond { transform: rotate(45deg) scale(.85); }

/* --- layout: the UI floats over the full-screen map ---------------------------------------- */
/* The container ignores touches so the map under its empty middle still pans and builds. */
#ui {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* Only real controls in the context row take touches; its spacer must let the map through. */
#top, #hint, #tools, #ctx > button { pointer-events: auto; }

#top { margin: 8px 8px 0; padding: 4px; border-radius: 16px; background: var(--panel); box-shadow: var(--ui-shadow); }
.toprow { display: flex; align-items: center; gap: 2px; }
.pill {
  padding: 0 14px; border-radius: 999px; background: var(--ui-accent); color: var(--ui-on-accent);
  font-weight: 700; font-size: 14px; white-space: nowrap;
}
.badge {
  position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--ui-badge); box-shadow: 0 0 0 2px var(--panel);
}
.goals { display: flex; gap: 10px; width: 100%; padding: 4px 8px 6px; text-align: left; border-radius: 12px; }
.goals:active { background: var(--ui-panel2); }
.goal { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.gl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.gl .n { overflow: hidden; text-overflow: ellipsis; }
.gl .r { margin-left: auto; color: var(--ui-muted); }
.gdone { font-size: 13px; color: var(--ui-muted); align-self: center; }
/* Bars scale a fill instead of changing width, so an update never triggers layout. */
.bar { display: block; height: 4px; border-radius: 2px; background: var(--ui-panel2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ui-accent); transform-origin: 0 50%; transform: scaleX(0); }
.done .bar > i { background: var(--accent); }
.bar.big { height: 8px; border-radius: 4px; margin: 6px 0 2px; }

#hint {
  margin: 8px 8px 0; display: flex; align-items: center; gap: 4px; padding: 6px 4px 6px 14px;
  border-radius: 14px; background: var(--panel); box-shadow: var(--ui-shadow); font-size: 14px;
}
#hint p { flex: 1; }

#bar { display: flex; flex-direction: column; gap: 8px; margin: 0 8px 8px; }
#ctx { display: flex; align-items: center; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border-radius: 999px;
  background: var(--panel); box-shadow: var(--ui-shadow); font-weight: 600; font-size: 14px;
}
/* Appears only when nothing has saved for ~30 s; amber like the map's stall markers, text dark enough on it. */
.chip.warn { padding: 0 12px; background: var(--ui-badge); color: #1d1500; margin-right: 4px; }
#tools {
  display: flex; gap: 2px; padding: 4px; border-radius: 16px; background: var(--panel); box-shadow: var(--ui-shadow);
  overflow-x: auto; overflow-y: hidden; touch-action: pan-x; overscroll-behavior: contain; scrollbar-width: none;
}
#tools::-webkit-scrollbar { display: none; }
.tool {
  position: relative; flex: none; width: 62px; height: 56px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.tool .tl { font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.tool.on { background: var(--ui-accent); color: var(--ui-on-accent); }
.tool.locked > .ico, .tool.locked > .tl { opacity: .38; }
.tool .lock { position: absolute; top: 4px; right: 6px; width: 14px; height: 14px; color: var(--ui-muted); }
.tool .dot { position: absolute; top: 6px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--ui-badge); }

/* --- focus mode: just the map and a way back ----------------------------------------------- */
body.focus #top, body.focus #bar, body.focus #hint { display: none; }
#unfocus {
  display: none; position: fixed; z-index: 11; opacity: .85;
  top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 10px);
}
body.focus #unfocus { display: inline-flex; }

/* --- toast --------------------------------------------------------------------------------- */
/* Near the top, under the goal strip, so an open sheet or the player's thumb never covers it. */
#toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); pointer-events: none;
  top: calc(env(safe-area-inset-top) + 118px); max-width: calc(100vw - 32px); width: max-content;
  padding: 10px 16px; border-radius: 999px; background: var(--fg); color: var(--bg);
  font-size: 14px; font-weight: 600; text-align: center; box-shadow: var(--ui-shadow); animation: pop .16s ease-out;
}
body.focus #toast { top: calc(env(safe-area-inset-top) + 66px); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -6px); } }

/* --- sheets -------------------------------------------------------------------------------- */
#scrim { position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, .38); pointer-events: auto; }
#sheet {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  max-height: 64vh; max-height: 64dvh; display: flex; flex-direction: column;
  background: var(--panel); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 24px var(--shadow);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  animation: rise .2s ease-out;
}
#sheet[aria-modal="true"] { max-height: 80vh; max-height: 80dvh; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 8px 6px 4px 18px; flex: none; }
.sheet-head h2 { flex: 1; font-size: 18px; }
.sheet-body {
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch;
  padding: 2px 18px 18px; display: flex; flex-direction: column; gap: 10px;
}
/* The body scrolls instead: in a height-capped flex column, contentless rows like bars would shrink to nothing. */
.sheet-body > * { flex: none; }
.sheet-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ui-muted); margin-top: 6px; }
.status { font-weight: 600; padding: 10px 12px; border-radius: 10px; background: var(--ui-panel2); }
.status.bad { color: var(--ui-bad); box-shadow: inset 4px 0 0 var(--bad); }
/* Blocked conveyors match their map marker: the bar is exactly the marker colour (--warn amber for
   a stall, --bad red otherwise); the text is a shade of it that stays readable on the panel. */
.status.stall { color: var(--ui-stall); box-shadow: inset 4px 0 0 var(--warn); }
.lead { font-size: 15px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.kv .k { color: var(--ui-muted); }
.kv .v { text-align: right; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; min-height: 28px; font-variant-numeric: tabular-nums; }
.row .name { flex: 1; min-width: 0; }
.row.over .num { color: var(--ui-bad); font-weight: 700; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--ui-bad); color: var(--ui-on-bad); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; background: var(--ui-panel2); font-weight: 600; }
.pick.on { background: var(--ui-accent); color: var(--ui-on-accent); }
.list { display: flex; flex-direction: column; gap: 4px; }
.choice {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border-radius: 12px;
  background: var(--ui-panel2); text-align: left; min-height: 52px;
}
.choice.on { outline: 2px solid var(--accent); }
.choice .grow small { display: block; color: var(--ui-muted); font-size: 12.5px; }
.lane { display: flex; flex-direction: column; gap: 6px; }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.item { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--ui-panel2); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.goalrow { display: flex; flex-direction: column; gap: 4px; }
.goalrow .gl { font-size: 15px; }
.res { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--ui-line); }
.res:first-child { border-top: 0; }
.res .grow { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.res .nm { font-weight: 700; }
.res .ds { font-size: 13.5px; color: var(--ui-muted); }
.res .why { font-size: 12.5px; color: var(--ui-muted); }
.res.done { opacity: .55; }
.costs { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cost { display: inline-flex; align-items: center; gap: 5px; }
.cost.short .num { color: var(--ui-bad); font-weight: 700; }
.buy { min-width: 72px; }
.unl li { margin: 2px 0; }
.unl { margin: 0; padding-left: 18px; }
.perf { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
textarea {
  width: 100%; min-height: 88px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid var(--ui-line);
  background: var(--bg); color: var(--fg); font: 16px/1.3 ui-monospace, Menlo, monospace; /* 16 px stops iOS zooming on focus */
  /* body turns the callout off for the map; iOS needs it back here or long-press shows no Paste (R24). */
  -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; touch-action: auto;
}
.note { font-size: 12.5px; color: var(--ui-muted); }

@media (prefers-reduced-motion: reduce) { #sheet, #toast { animation: none; } }
</style>

     unwired build never flashes empty bars. -->
<div id="ui" hidden>
  <header id="top">
    <div class="toprow">
      <button id="tier" class="pill" type="button"></button>
      <span class="grow"></span>
      <button id="savewarn" class="chip warn" type="button" hidden>Not saving</button>
      <button id="research" class="btn icon" type="button" aria-label="Research"><span data-icon="research"></span><span class="badge" hidden></span></button>

    </div>
    <button id="goals" class="goals" type="button" aria-label="Goals and Hub storage"></button>
  </header>
  <div id="hint" class="card" hidden>
    <p>Put a Miner on ore, a Furnace touching it, then draw a Belt from the Furnace into the Hub.</p>
    <button class="btn icon" type="button" aria-label="Dismiss hint"><span data-icon="close"></span></button>
  </div>
  <span class="grow"></span>
  <footer id="bar">
    <div id="ctx">
      <button id="undo" class="btn round" type="button" aria-label="Undo"><span data-icon="undo"></span></button>
      <span class="grow"></span>
      <button id="recipe" class="chip" type="button" hidden><span class="sw"></span><span class="t"></span><span data-icon="down"></span></button>
      <button id="rotate" class="btn round" type="button" aria-label="Rotate" hidden><span data-icon="rotate"></span></button>
      <button id="flip" class="btn round" type="button" aria-label="Flip corner" hidden><span data-icon="flip"></span></button>
      <button id="cancel" class="btn round" type="button" aria-label="Cancel" hidden><span data-icon="close"></span></button>
      <button id="ok" class="btn round primary" type="button" aria-label="Place" hidden><span data-icon="check"></span></button>
    </div>
    <nav id="tools" aria-label="Build tools"></nav>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<button id="unfocus" class="btn round" type="button" aria-label="Show controls"><span data-icon="expand"></span></button>
<div id="scrim" hidden></div>
<section id="sheet" role="dialog" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="btn icon" type="button" aria-label="Close"><span data-icon="close"></span></button></div>
  <div class="sheet-body"></div>
</section>
